# .github/workflows/convert-model.yml
# Converts embedding model and Llama LLM to Core ML on a macOS runner.
#
# Jobs:
#   convert-embeddings  — all-MiniLM-L6-v2 → MiniLMEmbedder.mlpackage   (issue #8)
#   convert-llm         — Llama 3.2 1B/3B  → LlamaModel.mlpackage        (issue #9, placeholder)
#
# MODEL_VARIANT input controls which Llama variant to convert: "1B" (default) or "3B"
name: Convert Core ML model
on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: 'Model variant to convert (1B or 3B)'
        required: true
        default: '1B'
        type: choice
        options: ['1B', '3B']

jobs:
  convert-embeddings:
    name: Convert embedding model (all-MiniLM-L6-v2)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      - name: Convert all-MiniLM-L6-v2 to Core ML
        run: python model/convert_embeddings.py --output-dir model/

      - name: Copy .mlpackage to iOS Resources
        run: |
          mkdir -p ios/ZeldaGuide/Resources
          cp -r model/MiniLMEmbedder.mlpackage ios/ZeldaGuide/Resources/MiniLMEmbedder.mlpackage

      - name: Upload MiniLMEmbedder.mlpackage artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniLMEmbedder.mlpackage
          path: model/MiniLMEmbedder.mlpackage
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          SIZE=$(du -sh model/MiniLMEmbedder.mlpackage 2>/dev/null | cut -f1 || echo "n/a")
          echo "## Embedding Model Conversion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Model: all-MiniLM-L6-v2" >> $GITHUB_STEP_SUMMARY
          echo "- Output: MiniLMEmbedder.mlpackage ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-15" >> $GITHUB_STEP_SUMMARY

  convert-llm:
    name: Convert LLM (Llama ${{ github.event.inputs.model_variant }})
    runs-on: macos-15
    env:
      MODEL_VARIANT: ${{ github.event.inputs.model_variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      - name: Run unit tests
        run: pytest model/tests/test_convert_llm.py -v

      - name: Convert Llama to Core ML
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python model/convert_llm.py --output-dir model/

      - name: Upload LlamaModel artifact
        uses: actions/upload-artifact@v4
        with:
          name: LlamaModel-${{ github.event.inputs.model_variant }}.mlpackage
          path: model/LlamaModel-${{ github.event.inputs.model_variant }}.mlpackage
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          ARTIFACT="model/LlamaModel-${MODEL_VARIANT}.mlpackage"
          SIZE=$(du -sh "$ARTIFACT" 2>/dev/null | cut -f1 || echo "n/a")
          echo "## LLM Conversion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Model variant: $MODEL_VARIANT" >> $GITHUB_STEP_SUMMARY
          echo "- Output: LlamaModel-${MODEL_VARIANT}.mlpackage ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-15" >> $GITHUB_STEP_SUMMARY
