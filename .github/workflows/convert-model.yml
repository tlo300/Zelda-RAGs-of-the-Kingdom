# .github/workflows/convert-model.yml
# Converts embedding model and Qwen2.5 LLM to Core ML on a macOS runner.
#
# Jobs:
#   convert-embeddings  — all-MiniLM-L6-v2 → MiniLMEmbedder.mlpackage   (issue #8)
#   convert-llm         — Qwen2.5 1B/3B     → QwenModel.mlpackage        (issue #9)
#
# Inputs:
#   model_variant      — "1B" (default) or "3B"
#   skip_conversion    — if true, downloads the existing artifact and only runs smoke test.
#                        Use this after a failed smoke test to avoid re-running the 1h+ conversion.
name: Convert Core ML model
on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: 'Model variant to convert (1B or 3B)'
        required: true
        default: '1B'
        type: choice
        options: ['1B', '3B']
      skip_conversion:
        description: 'Skip conversion — reuse existing artifact (smoke test only)'
        required: false
        default: false
        type: boolean
      artifact_run_id:
        description: 'Run ID to download artifact from (required when skip_conversion=true)'
        required: false
        default: ''
        type: string

jobs:
  convert-embeddings:
    name: Convert embedding model (all-MiniLM-L6-v2)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      - name: Convert all-MiniLM-L6-v2 to Core ML
        run: python model/convert_embeddings.py --output-dir model/

      - name: Copy .mlpackage to iOS Resources
        run: |
          mkdir -p ios/ZeldaGuide/Resources
          cp -r model/MiniLMEmbedder.mlpackage ios/ZeldaGuide/Resources/MiniLMEmbedder.mlpackage

      - name: Upload MiniLMEmbedder.mlpackage artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniLMEmbedder.mlpackage
          path: model/MiniLMEmbedder.mlpackage
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          SIZE=$(du -sh model/MiniLMEmbedder.mlpackage 2>/dev/null | cut -f1 || echo "n/a")
          echo "## Embedding Model Conversion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Model: all-MiniLM-L6-v2" >> $GITHUB_STEP_SUMMARY
          echo "- Output: MiniLMEmbedder.mlpackage ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-14" >> $GITHUB_STEP_SUMMARY

  convert-llm:
    name: Convert LLM (Qwen2.5-${{ github.event.inputs.model_variant }})
    runs-on: macos-15
    env:
      MODEL_VARIANT: ${{ github.event.inputs.model_variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      - name: Run unit tests
        run: pytest model/tests/test_convert_llm.py -v

      # Cache the HuggingFace model weights between runs (~3 GB download avoided).
      # Key includes the model variant so 1B and 3B caches don't collide.
      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-${{ github.event.inputs.model_variant }}-v1

      # --- Full conversion path (skip_conversion = false) ---

      - name: Convert Qwen2.5 to Core ML
        if: ${{ github.event.inputs.skip_conversion != 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python model/convert_llm.py --output-dir model/

      - name: Upload QwenModel artifact
        if: ${{ github.event.inputs.skip_conversion != 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: QwenModel-${{ github.event.inputs.model_variant }}.mlpackage
          path: model/QwenModel-${{ github.event.inputs.model_variant }}.mlpackage
          retention-days: 30

      - name: Upload tokenizer.json artifact
        if: ${{ github.event.inputs.skip_conversion != 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer.json
          path: model/tokenizer.json
          retention-days: 30

      # --- Tokenizer (both paths) ---
      # Downloads tokenizer.json from HuggingFace without loading model weights (~5 s).
      # Runs on the skip_conversion path so build-ipa.yml always has a tokenizer artifact.

      - name: Download and upload tokenizer.json (skip path)
        if: ${{ github.event.inputs.skip_conversion == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PYEOF'
          import os, tempfile, shutil
          from pathlib import Path
          from transformers import AutoTokenizer
          variant = os.environ["MODEL_VARIANT"]
          hf_ids = {"1B": "Qwen/Qwen2.5-1.5B-Instruct", "3B": "Qwen/Qwen2.5-3B-Instruct"}
          hf_id = hf_ids[variant]
          tok = AutoTokenizer.from_pretrained(hf_id, token=os.environ.get("HF_TOKEN",""))
          with tempfile.TemporaryDirectory() as tmp:
              tok.save_pretrained(tmp)
              shutil.copy(Path(tmp) / "tokenizer.json", "model/tokenizer.json")
          size_kb = Path("model/tokenizer.json").stat().st_size // 1024
          print(f"tokenizer.json saved ({size_kb} KB)")
          PYEOF

      - name: Upload tokenizer.json artifact (skip path)
        if: ${{ github.event.inputs.skip_conversion == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer.json
          path: model/tokenizer.json
          retention-days: 30

      # --- Smoke-test-only path (skip_conversion = true) ---

      - name: Download existing artifact
        if: ${{ github.event.inputs.skip_conversion == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: QwenModel-${{ github.event.inputs.model_variant }}.mlpackage
          path: model/QwenModel-${{ github.event.inputs.model_variant }}.mlpackage
          run-id: ${{ github.event.inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test existing artifact
        if: ${{ github.event.inputs.skip_conversion == 'true' }}
        env:
          PYTHONPATH: .
        run: python model/smoke_test_llm.py --model-path "model/QwenModel-${MODEL_VARIANT}.mlpackage"

      - name: Write job summary
        if: always()
        run: |
          ARTIFACT="model/QwenModel-${MODEL_VARIANT}.mlpackage"
          SIZE=$(du -sh "$ARTIFACT" 2>/dev/null | cut -f1 || echo "n/a")
          SKIPPED="${{ github.event.inputs.skip_conversion }}"
          echo "## LLM Conversion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Model variant: $MODEL_VARIANT" >> $GITHUB_STEP_SUMMARY
          echo "- Output: QwenModel-${MODEL_VARIANT}.mlpackage ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "- Conversion skipped: $SKIPPED" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-15" >> $GITHUB_STEP_SUMMARY
