# .github/workflows/build-ipa.yml
# Builds an unsigned .ipa for AltStore / SideStore sideloading.
# Triggers manually via workflow_dispatch only.
#
# ── Apple signing for the 3B upgrade path ─────────────────────────────────
# If you acquire a paid Apple Developer account (required for ad-hoc or
# App Store distribution), replace the unsigned packaging step below with
# a proper xcodebuild -exportArchive call using an ExportOptions.plist:
#
#   <key>method</key><string>ad-hoc</string>
#   <key>signingStyle</key><string>manual</string>
#   <key>provisioningProfiles</key>
#   <dict>
#     <key>com.yourname.ZeldaGuide</key><string>YourProfileName</string>
#   </dict>
#
# Before calling xcodebuild -exportArchive, import your Distribution
# certificate and provisioning profile into the macOS keychain:
#
#   echo "$CERTIFICATE_P12" | base64 --decode > cert.p12
#   security import cert.p12 -k ~/Library/Keychains/login.keychain-db \
#     -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
#
# Store CERTIFICATE_P12, CERTIFICATE_PASSWORD, and the provisioning profile
# as GitHub Actions secrets. See docs/upgrade-to-3b.md for the full workflow.
# ──────────────────────────────────────────────────────────────────────────
name: Build iOS .ipa

on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: 'Model variant bundled in the .ipa (1B or 3B)'
        required: true
        default: '1B'
        type: choice
        options: ['1B', '3B']
      llm_run_id:
        description: 'Run ID of convert-model.yml that produced the QwenModel artifact'
        required: true
        type: string
      tokenizer_run_id:
        description: 'Run ID that produced the tokenizer.json artifact (leave blank to use llm_run_id)'
        required: false
        type: string

jobs:
  build-ipa:
    name: Build unsigned .ipa (AltStore / SideStore)
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install model conversion dependencies
        run: pip install -r model/requirements.txt

      - name: Convert embedding model (MiniLMEmbedder)
        run: python model/convert_embeddings.py --output-dir model/

      - name: Compile MiniLMEmbedder to .mlmodelc and inject into Resources
        run: |
          xcrun coremlcompiler compile model/MiniLMEmbedder.mlpackage model/
          rm -rf ios/ZeldaGuide/Resources/MiniLMEmbedder.mlmodelc
          mv model/MiniLMEmbedder.mlmodelc ios/ZeldaGuide/Resources/MiniLMEmbedder.mlmodelc

      - name: Download QwenModel artifact
        uses: actions/download-artifact@v4
        with:
          name: QwenModel-${{ inputs.model_variant }}.mlpackage
          path: ios/ZeldaGuide/Resources/QwenModel-${{ inputs.model_variant }}.mlpackage
          run-id: ${{ inputs.llm_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile QwenModel to .mlmodelc
        run: |
          VARIANT="${{ inputs.model_variant }}"
          xcrun coremlcompiler compile \
            "ios/ZeldaGuide/Resources/QwenModel-${VARIANT}.mlpackage" \
            "ios/ZeldaGuide/Resources/"
          rm -rf "ios/ZeldaGuide/Resources/QwenModel-${VARIANT}.mlpackage"

      - name: Download tokenizer.json artifact
        uses: actions/download-artifact@v4
        with:
          name: tokenizer.json
          path: ios/ZeldaGuide/Resources
          run-id: ${{ inputs.tokenizer_run_id != '' && inputs.tokenizer_run_id || inputs.llm_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ios/ZeldaGuide.xcodeproj \
            -scheme ZeldaGuide \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ZeldaGuide.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/ZeldaGuide.xcarchive/Products/Applications/ZeldaGuide.app" \
                "$RUNNER_TEMP/Payload/ZeldaGuide.app"
          cd "$RUNNER_TEMP"
          zip -r ZeldaGuide.ipa Payload/

      - name: Build versioned filename
        id: versioned_name
        run: |
          VERSION=$(grep MARKETING_VERSION ios/ZeldaGuide.xcodeproj/project.pbxproj \
            | head -1 | sed 's/.*= //;s/;//')
          DATE=$(date -u +%Y%m%d)
          FILENAME="ZeldaGuide-v${VERSION}-${{ inputs.model_variant }}-${DATE}-r${{ github.run_number }}.ipa"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          cp "$RUNNER_TEMP/ZeldaGuide.ipa" "$RUNNER_TEMP/$FILENAME"

      - name: Get .ipa size
        id: ipa_size
        run: |
          SIZE=$(du -sh "$RUNNER_TEMP/ZeldaGuide.ipa" | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versioned_name.outputs.filename }}
          path: ${{ runner.temp }}/${{ steps.versioned_name.outputs.filename }}
          retention-days: 30

      - name: Upload to kDrive
        if: env.KDRIVE_USER != ''
        env:
          KDRIVE_USER: ${{ secrets.KDRIVE_USER }}
          KDRIVE_PASS: ${{ secrets.KDRIVE_PASS }}
          KDRIVE_FOLDER: ${{ secrets.KDRIVE_FOLDER }}
        run: |
          brew install rclone
          OBSCURED=$(rclone obscure "$KDRIVE_PASS")
          rclone copy "$RUNNER_TEMP/${{ steps.versioned_name.outputs.filename }}" \
            ":webdav,url=https://connect.drive.infomaniak.com,vendor=nextcloud,user=$KDRIVE_USER,pass=$OBSCURED:$KDRIVE_FOLDER" \
            --progress
          echo "Uploaded ${{ steps.versioned_name.outputs.filename }} to kDrive $KDRIVE_FOLDER"

      - name: Write job summary
        if: always()
        run: |
          echo "## Build .ipa Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-15" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: ${{ steps.versioned_name.outputs.filename }}" >> $GITHUB_STEP_SUMMARY
          echo "- Model variant: Qwen2.5 ${{ inputs.model_variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- Size: ${{ steps.ipa_size.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- Signing: unsigned (AltStore / SideStore)" >> $GITHUB_STEP_SUMMARY
