# .github/workflows/debug-simulator.yml
# Builds the app with real Core ML models, launches it on an iOS simulator,
# and streams the console log so you can see model loading output and any errors.
#
# ChatViewModel.init() calls engine.prepare() immediately, so launching the app
# automatically exercises the full LLM load → embedding load → ready path.
# Any crash or LLMError surfaces via print() or a chat message.
#
# Usage:
#   Trigger manually via Actions → "Debug on iOS Simulator" → Run workflow.
#   Provide the run ID from a successful convert-model.yml run.

name: Debug on iOS Simulator

on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: 'Model variant (1B or 3B)'
        required: true
        default: '1B'
        type: choice
        options: ['1B', '3B']
      llm_run_id:
        description: 'Run ID of convert-model.yml that produced the QwenModel artifact'
        required: true
        type: string
      tokenizer_run_id:
        description: 'Run ID that produced tokenizer.json (leave blank to use llm_run_id)'
        required: false
        type: string

jobs:
  debug-simulator:
    name: Launch app on iOS Simulator and capture logs
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    # Model compilation can take 30–60 min on the first run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install model conversion dependencies
        run: pip install -r model/requirements.txt

      - name: Convert embedding model (MiniLMEmbedder)
        run: python model/convert_embeddings.py --output-dir model/

      - name: Compile MiniLMEmbedder to .mlmodelc and inject into Resources
        run: |
          xcrun coremlcompiler compile model/MiniLMEmbedder.mlpackage model/ \
            --platform iphonesimulator --deployment-target 18.0
          rm -rf ios/ZeldaGuide/Resources/MiniLMEmbedder.mlmodelc
          mv model/MiniLMEmbedder.mlmodelc ios/ZeldaGuide/Resources/MiniLMEmbedder.mlmodelc

      - name: Download QwenModel artifact
        uses: actions/download-artifact@v4
        with:
          name: QwenModel-${{ inputs.model_variant }}.mlpackage
          path: ios/ZeldaGuide/Resources/QwenModel-${{ inputs.model_variant }}.mlpackage
          run-id: ${{ inputs.llm_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile QwenModel to .mlmodelc
        run: |
          VARIANT="${{ inputs.model_variant }}"
          xcrun coremlcompiler compile \
            "ios/ZeldaGuide/Resources/QwenModel-${VARIANT}.mlpackage" \
            "ios/ZeldaGuide/Resources/" \
            --platform iphonesimulator --deployment-target 18.0
          rm -rf "ios/ZeldaGuide/Resources/QwenModel-${VARIANT}.mlpackage"

      - name: Download tokenizer.json artifact
        uses: actions/download-artifact@v4
        with:
          name: tokenizer.json
          path: ios/ZeldaGuide/Resources
          run-id: ${{ inputs.tokenizer_run_id != '' && inputs.tokenizer_run_id || inputs.llm_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and boot iOS simulator
        run: |
          python3 << 'PYEOF'
          import subprocess, json, os, sys

          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
          ios = [r for r in runtimes if r.get("isAvailable") and "iOS" in r.get("name", "")]
          if not ios:
              print("No available iOS runtime"); sys.exit(1)
          runtime = ios[0]["identifier"]
          print("Runtime:", runtime)

          devtypes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))["devicetypes"]
          iphones = [d for d in devtypes if "iPhone" in d.get("name", "")]
          preferred = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          devtype = next(
              (d["identifier"] for name in preferred for d in iphones if d["name"] == name),
              iphones[-1]["identifier"] if iphones else None,
          )
          if not devtype:
              print("No iPhone device type found"); sys.exit(1)
          print("Device type:", devtype)

          udid = subprocess.check_output(["xcrun", "simctl", "create", "DebugDevice", devtype, runtime]).decode().strip()
          print("UDID:", udid)
          subprocess.check_call(["xcrun", "simctl", "boot", udid])

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SIMULATOR_UDID={udid}\n")
          PYEOF

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/ZeldaGuide.xcodeproj \
            -scheme ZeldaGuide

      - name: Build app for iOS Simulator
        run: |
          xcodebuild build \
            -project ios/ZeldaGuide.xcodeproj \
            -scheme ZeldaGuide \
            -destination "id=${{ env.SIMULATOR_UDID }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Locate .app bundle
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" -name "ZeldaGuide.app" -not -path "*/Tests*" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: ZeldaGuide.app not found in DerivedData" >&2
            exit 1
          fi
          echo "APP_PATH=$APP" >> $GITHUB_ENV
          echo "App bundle: $APP"

      - name: Install app on simulator
        run: xcrun simctl install "${{ env.SIMULATOR_UDID }}" "${{ env.APP_PATH }}"

      - name: Start simulator log stream (background)
        run: |
          # Stream all output from the ZeldaGuide process.
          # --style compact gives one readable line per log entry.
          xcrun simctl spawn "${{ env.SIMULATOR_UDID }}" log stream \
            --predicate 'processImagePath CONTAINS "ZeldaGuide"' \
            --style compact \
            > "$RUNNER_TEMP/simulator.log" 2>&1 &
          echo "LOG_STREAM_PID=$!" >> $GITHUB_ENV
          sleep 1   # let the stream connect before the app launches

      - name: Launch app on simulator
        run: |
          # --console-pty pipes the app's stdout/stderr here (print() calls).
          # Launch is non-blocking; the app runs in the background.
          xcrun simctl launch "${{ env.SIMULATOR_UDID }}" com.tlo300.ZeldaGuide 2>&1
          echo "App launched"

      - name: Wait for model to load (up to 10 min)
        run: |
          # Poll the log for the LLMService ready-or-error message.
          # LLMService prints nothing on success; ChatViewModel would set isReady=true.
          # We look for either a crash indicator or silence (normal load completes).
          echo "Waiting for model load to complete..."
          for i in $(seq 1 60); do
            sleep 10
            echo "--- elapsed: ${i}0s ---"
            # If the app process has died, stop waiting.
            if ! xcrun simctl spawn "${{ env.SIMULATOR_UDID }}" \
                ps ax 2>/dev/null | grep -q ZeldaGuide; then
              echo "ZeldaGuide process is gone — likely crashed."
              break
            fi
            # Look for known success or error markers in the streamed log.
            if grep -q "LLMService\|EmbeddingError\|LLMError\|Memory warning\|Guide unavailable\|LLM unavailable" \
                "$RUNNER_TEMP/simulator.log" 2>/dev/null; then
              echo "Found relevant log output — printing early."
              break
            fi
          done

      - name: Stop log stream
        if: always()
        run: kill "${{ env.LOG_STREAM_PID }}" 2>/dev/null || true

      - name: Print simulator console log
        if: always()
        run: |
          echo "=== Simulator log (ZeldaGuide process) ==="
          cat "$RUNNER_TEMP/simulator.log" || echo "(log file not found)"

      - name: Check for crash reports
        if: always()
        run: |
          echo "=== Crash reports ==="
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          CRASHES=$(find "$CRASH_DIR" -name "ZeldaGuide*.crash" 2>/dev/null)
          if [ -n "$CRASHES" ]; then
            for f in $CRASHES; do
              echo "--- $f ---"
              head -120 "$f"
            done
          else
            echo "No crash reports found — app did not crash (or crash report not yet written)."
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## Debug Simulator Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-15" >> $GITHUB_STEP_SUMMARY
          echo "- Simulator UDID: ${{ env.SIMULATOR_UDID }}" >> $GITHUB_STEP_SUMMARY
          echo "- Model variant: Qwen2.5 ${{ inputs.model_variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- LLM run ID: ${{ inputs.llm_run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the 'Print simulator console log' and 'Check for crash reports' steps for output." >> $GITHUB_STEP_SUMMARY
