# .github/workflows/test-ios.yml
# Runs the XCTest suite on an iOS simulator on every push to main and on every PR.
# No real Core ML models required — all services use injected mocks.
# Catches: compilation errors, Swift logic bugs, MLMultiArray shape contract violations.
name: iOS unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: XCTest on iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Create and boot iOS simulator
        run: |
          # Find an available iOS runtime
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
import json, sys
data = json.load(sys.stdin)
runtimes = [r for r in data['runtimes'] if r.get('isAvailable') and 'iOS' in r.get('name','')]
if not runtimes:
    print('ERROR: no iOS runtimes available', file=sys.stderr); sys.exit(1)
print(runtimes[0]['identifier'])
")
          echo "Runtime: $RUNTIME"
          # Find the best available iPhone device type
          DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c "
import json, sys
data = json.load(sys.stdin)
iphones = [d for d in data['devicetypes'] if 'iPhone' in d.get('name','')]
preferred = ['iPhone 16 Pro', 'iPhone 16', 'iPhone 15 Pro', 'iPhone 15']
for name in preferred:
    for d in iphones:
        if d['name'] == name:
            print(d['identifier']); sys.exit(0)
if iphones:
    print(iphones[-1]['identifier'])
")
          echo "Device type: $DEVTYPE"
          UDID=$(xcrun simctl create CIDevice "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/ZeldaGuide.xcodeproj \
            -scheme ZeldaGuide

      - name: Run unit tests on simulator
        run: |
          xcodebuild test \
            -project ios/ZeldaGuide.xcodeproj \
            -scheme ZeldaGuide \
            -destination "id=${{ env.SIMULATOR_UDID }}" \
            -only-testing:ZeldaGuideTests

      - name: Write job summary
        if: always()
        run: |
          echo "## iOS Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-15" >> $GITHUB_STEP_SUMMARY
          echo "- Simulator UDID: ${{ env.SIMULATOR_UDID }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ZeldaGuideTests" >> $GITHUB_STEP_SUMMARY
