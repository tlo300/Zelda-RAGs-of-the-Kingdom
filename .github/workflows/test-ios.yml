# .github/workflows/test-ios.yml
# Runs the XCTest suite on an iOS simulator on every push to main and on every PR.
# No real Core ML models required — all services use injected mocks.
# Catches: compilation errors, Swift logic bugs, MLMultiArray shape contract violations.
name: iOS unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: XCTest on iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/ZeldaGuide.xcodeproj \
            -scheme ZeldaGuide

      - name: Run unit tests on simulator
        run: |
          xcodebuild test \
            -project ios/ZeldaGuide.xcodeproj \
            -scheme ZeldaGuide \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -only-testing:ZeldaGuideTests

      - name: Write job summary
        if: always()
        run: |
          echo "## iOS Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-15" >> $GITHUB_STEP_SUMMARY
          echo "- Destination: iPhone 16 Simulator" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ZeldaGuideTests" >> $GITHUB_STEP_SUMMARY
