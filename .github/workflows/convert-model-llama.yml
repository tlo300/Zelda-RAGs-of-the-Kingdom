# .github/workflows/convert-model-llama.yml
# Converts Llama 3.2 LLM to Core ML on a macOS runner (HyruleSage app).
#
# PREREQUISITE: Accept Meta's Llama licence at https://huggingface.co/meta-llama
# before use. HF_TOKEN must belong to an account with access granted.
#
# Jobs:
#   convert-llm  — Llama 3.2 1B/3B → LlamaModel.mlpackage   (HyruleSage)
#
# The embedding model (MiniLMEmbedder) is shared with ZeldaGuide.
# Run convert-model.yml to regenerate it if needed; its artifact is reused here.
#
# Inputs:
#   model_variant      — "1B" (default) or "3B"
#   skip_conversion    — if true, downloads the existing artifact and only runs smoke test.
name: Convert Core ML model (Llama / HyruleSage)
on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: 'Model variant to convert (1B or 3B)'
        required: true
        default: '1B'
        type: choice
        options: ['1B', '3B']
      skip_conversion:
        description: 'Skip conversion — reuse existing artifact (smoke test only)'
        required: false
        default: false
        type: boolean
      artifact_run_id:
        description: 'Run ID to download artifact from (required when skip_conversion=true)'
        required: false
        default: ''
        type: string

jobs:
  convert-llm:
    name: Convert LLM (Llama 3.2-${{ github.event.inputs.model_variant }})
    runs-on: macos-15
    env:
      MODEL_VARIANT: ${{ github.event.inputs.model_variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      - name: Run unit tests (convert_llm helpers)
        run: pytest model/tests/test_convert_llm.py -v

      # Cache the HuggingFace model weights between runs (~3 GB download avoided).
      # Key includes model variant so 1B and 3B caches don't collide.
      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-llama3.2-${{ github.event.inputs.model_variant }}-v1

      # --- Full conversion path (skip_conversion = false) ---

      - name: Convert Llama 3.2 to Core ML
        if: ${{ github.event.inputs.skip_conversion != 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python model/convert_llm_llama.py --output-dir model/

      - name: Upload LlamaModel artifact
        if: ${{ github.event.inputs.skip_conversion != 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LlamaModel-${{ github.event.inputs.model_variant }}.mlpackage
          path: model/LlamaModel-${{ github.event.inputs.model_variant }}.mlpackage
          retention-days: 30

      - name: Upload tokenizer.json artifact
        if: ${{ github.event.inputs.skip_conversion != 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer-llama.json
          path: model/tokenizer.json
          retention-days: 30

      # --- Tokenizer (skip path) ---

      - name: Download and upload tokenizer.json (skip path)
        if: ${{ github.event.inputs.skip_conversion == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PYEOF'
          import os, tempfile, shutil
          from pathlib import Path
          from transformers import AutoTokenizer
          variant = os.environ["MODEL_VARIANT"]
          hf_ids = {"1B": "meta-llama/Llama-3.2-1B-Instruct", "3B": "meta-llama/Llama-3.2-3B-Instruct"}
          hf_id = hf_ids[variant]
          tok = AutoTokenizer.from_pretrained(hf_id, token=os.environ.get("HF_TOKEN",""))
          with tempfile.TemporaryDirectory() as tmp:
              tok.save_pretrained(tmp)
              shutil.copy(Path(tmp) / "tokenizer.json", "model/tokenizer.json")
          size_kb = Path("model/tokenizer.json").stat().st_size // 1024
          print(f"tokenizer.json saved ({size_kb} KB)")
          PYEOF

      - name: Upload tokenizer.json artifact (skip path)
        if: ${{ github.event.inputs.skip_conversion == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer-llama.json
          path: model/tokenizer.json
          retention-days: 30

      # --- Smoke-test-only path (skip_conversion = true) ---

      - name: Download existing artifact
        if: ${{ github.event.inputs.skip_conversion == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: LlamaModel-${{ github.event.inputs.model_variant }}.mlpackage
          path: model/LlamaModel-${{ github.event.inputs.model_variant }}.mlpackage
          run-id: ${{ github.event.inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test existing artifact
        if: ${{ github.event.inputs.skip_conversion == 'true' }}
        env:
          PYTHONPATH: .
          MODEL_VARIANT: ${{ github.event.inputs.model_variant }}
        run: python model/smoke_test_llm.py --model-path "model/LlamaModel-${MODEL_VARIANT}.mlpackage"

      - name: Write job summary
        if: always()
        run: |
          ARTIFACT="model/LlamaModel-${MODEL_VARIANT}.mlpackage"
          SIZE=$(du -sh "$ARTIFACT" 2>/dev/null | cut -f1 || echo "n/a")
          SKIPPED="${{ github.event.inputs.skip_conversion }}"
          echo "## Llama LLM Conversion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Model variant: Llama 3.2 $MODEL_VARIANT" >> $GITHUB_STEP_SUMMARY
          echo "- Output: LlamaModel-${MODEL_VARIANT}.mlpackage ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "- Conversion skipped: $SKIPPED" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-15" >> $GITHUB_STEP_SUMMARY
