# .github/workflows/pipeline.yml
# Runs the Python data pipeline tests and validates the knowledge base.
# Triggers manually via workflow_dispatch only.
name: Data pipeline

on:
  workflow_dispatch:

jobs:
  pipeline:
    name: Run pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pytest
        run: pytest pipeline/tests/ -v --tb=short

      - name: Write job summary
        if: always()
        run: |
          echo "## Data Pipeline CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Python: 3.11" >> $GITHUB_STEP_SUMMARY
          echo "- Test suite: \`pipeline/tests/\`" >> $GITHUB_STEP_SUMMARY
